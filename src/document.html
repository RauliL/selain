<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        --selain-window-background: {{ window-background }};
        --selain-window-foreground: {{ window-foreground }};
        --selain-status-bar-background: {{ status-bar-background }};
        --selain-status-bar-foreground: {{ status-bar-foreground }};
        --selain-status-bar-error-background: {{ status-bar-error-background }};
        --selain-status-bar-error-foreground: {{ status-bar-error-foreground }};
        --selain-mode-bar-normal-background: {{ mode-bar-normal-background }};
        --selain-mode-bar-normal-foreground: {{ mode-bar-normal-foreground }};
        --selain-mode-bar-insert-background: {{ mode-bar-insert-background }};
        --selain-mode-bar-insert-foreground: {{ mode-bar-insert-foreground }};
      }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--selain-window-background);
        color: var(--selain-window-foreground);
        font: 16px/1.55 system-ui, sans-serif;
      }

      main {
        max-width: 46rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem
      }

      a {
        color: var(--selain-status-bar-foreground);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      h1, h2, h3 {
        line-height: 1.25;
      }

      h1 {
        font-size: 1.8rem;
      }

      h2 {
        font-size: 1.4rem;
      }

      h3 {
        font-size: 1.15rem;
      }

      input, button {
        font: inherit;
        margin-top: .75rem;
      }

      input {
        width: min(100%, 24rem);
        padding: .4rem .55rem;
      }

      button {
        padding: .4rem .8rem;
      }

      blockquote {
        margin: 0.75rem 0;
        padding-left: 0.9rem;
        border-left: 3px solid var(--selain-mode-bar-insert-background);
      }

      pre {
        overflow-x: auto;
        white-space: pre-wrap;
        padding: 0.85rem 1rem;
        background: color-mix(in srgb, var(--selain-window-background), black 20%);
        border-radius: 4px;
        font: 14px/1.45 ui-monospace, monospace;
      }

      ul {
        padding-left: 1.25rem;
      }

      menu, menu > li {
        list-style: none;
        margin-left: 0;
        padding-left: 0;
      }

      menu > li[data-type] {
        display: grid;
        grid-template-columns: 4.5rem 1fr;
        gap: 0.55rem;
        padding: 0.2rem 0;
      }

      menu > li[data-type]::before {
        content: attr(data-type);
        color: var(--selain-mode-bar-insert-background);
        font: 13px/1.55 ui-monospace, monospace;
        text-align: right;
        margin-right: 1ch;
      }

      menu > li[data-type="error"]::before {
        color: var(--selain-status-bar-error-background);
      }
    </style>
  </head>
  <body>
    <main>{{ body }}</main>
  </body>
</html>
